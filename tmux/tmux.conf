# 0 is too far from ` ;)
set -g base-index 1
#
# Bigger scrollback
set -g history-limit 100000

# Automatically set window title
set-window-option -g automatic-rename on
set-option -g set-titles on

set -g default-terminal "xterm-256color"
# Tell Tmux that outside terminal supports true color
set -ga terminal-overrides ",xterm-256color*:Tc"

set -g status-keys vi

set -g mouse on
# Click a window name in the status bar to select it. Ghostty (as of 1.3.x)
# doesn't reliably forward the mouse PRESS to tmux, so the default
# MouseDown1Status binding never fires — see ghostty#11319 / discussion #11342.
# Bind to mouse-UP (and drag-end) instead, which Ghostty does forward.
unbind -n MouseDown1Status
bind -n MouseUp1Status select-window -t =
bind -n MouseDragEnd1Status select-window -t =

# Same Ghostty mouse-press issue applies to selecting a PANE: the default
# binding is on MouseDown1Pane, which Ghostty doesn't reliably forward — so a
# single click won't focus a pane (you end up needing a second click). Rebind
# pane-select to mouse-UP, which Ghostty does forward. Keep `send-keys -M` so
# the click is still passed through to mouse-aware apps (nvim, less). Drag-to-
# copy is unaffected: it runs through MouseDrag1Pane / MouseDragEnd1Pane.
unbind -n MouseDown1Pane
bind -n MouseUp1Pane select-pane -t = \; send-keys -M
setw -g mode-keys vi
setw -g monitor-activity on
set -g visual-activity on

# Better focus events for nvim
set -g focus-events on

# Renumber windows when one is closed
set -g renumber-windows on

# Changing the way that split panes work
unbind % # Remove default binding since we’re replacing
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Use Alt-vim keys without prefix key to switch panes
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Bind resize keys
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# No delay for escape key press
set -sg escape-time 0

# Reload tmux config
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"
bind-key T split-window -h "nvim ~/.config/tmux/tmux.conf"
bind-key N split-window -h "nvim ~/.config/nvim/lua/plugins/plugins.lua"
bind-key C split-window -v -c "#{pane_current_path}" "claude"


# bind-key -T copy-mode-vi v send-keys -X begin-selection
# bind-key -T copy-mode-vi y send-keys -X copy-selection
# bind-key -T copy-mode-vi r send-keys -X rectangle-toggle

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind P paste-buffer
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"


# ═════════════════════════════════════════════════════════════════════════════
# STATUS BAR
# ═════════════════════════════════════════════════════════════════════════════

set -g @p_bg        "#1a1a1a"
set -g @p_fg        "#e8e8ec"
set -g @p_active_fg "#18181b"
set -g @p_sess      "#cf590c"
set -g @p_sessname  "#51515a"
set -g @p_cpu       "#437f83"
set -g @p_mem       "#669867"
set -g @p_batt      "#c68c1c"
set -g @p_time      "#1a1a1a"

# ── ACCENT — pick ONE (exact tokyonight-storm hex). Marks the active window. ──
# set -g @p_active "#7aa2f7"        ;# blue   (RECOMMENDED)
# set -g @p_active "#7dcfff"      ;# cyan
# set -g @p_active "#1abc9c"      ;# teal
# set -g @p_active "#9ece6a"      ;# green
# set -g @p_active "#e0af68"      ;# yellow
# set -g @p_active "#ff9e64"      ;# orange
# set -g @p_active "#f7768e"      ;# red
# set -g @p_active "#bb9af7"      ;# magenta
set -g @p_active "#9d7cd8"      ;# purple

# ── Layout (reads @p_* above — no need to touch this when switching accent) ───
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
# Clear the deprecated status-fg/bg. An old config left status-bg=black on the
# running server; because that option overrides status-style, it blacked out the
# gap. "default" makes them defer to status-style below.
set -g status-fg default
set -g status-bg default
set -gF status-style "bg=#{@p_bg},fg=#{@p_fg}"
set -g status-left-length 60
set -g status-right-length 80

# Left — "SESSION" badge + session name (session name shares the bar bg)
set -g status-left "#[fg=#{@p_fg},bg=#{@p_sess},bold] SESSION #[fg=#{@p_fg},bg=#{@p_sessname},nobold] #S #[default]"

# Windows — colours come from the *-style options. window-status-style is also
# what paints the empty gap (and #[default]) in the bar bg; with it unset, both
# fall back to the terminal's black. Activity style = inactive style (no flash),
# so a window's activity flag never recolours it.
set -g window-status-separator ""
set -gF window-status-style          "fg=#{@p_fg},bg=#{@p_bg}"
set -gF window-status-activity-style "fg=#{@p_fg},bg=#{@p_bg}"
set -gF window-status-current-style  "fg=#{@p_active_fg},bg=#{@p_active},bold"
set -gF window-status-bell-style     "fg=#{@p_active},bg=#{@p_bg},bold"
set -g window-status-format          " #I #W "
set -g window-status-current-format  " #I #W "

# Right — CPU · MEM · battery (plug logo) · date+time
set -g status-right "#[fg=#{@p_fg},bg=#{@p_time}]   %Y-%m-%d %H:%M  #[fg=#{@p_fg},bg=#{@p_cpu}] CPU #(~/.config/tmux/scripts/cpu.sh) #[fg=#{@p_fg},bg=#{@p_mem}] MEM #(~/.config/tmux/scripts/mem.sh) #[fg=#{@p_fg},bg=#{@p_batt}] BAT #(~/.config/tmux/scripts/battery.sh) #[default]"

# Polish — the accent shows up here too
set -gF pane-border-style "fg=#43434c"
set -gF pane-active-border-style "fg=#{@p_active}"
set -gF message-style "bg=#{@p_active},fg=#{@p_active_fg},bold"
set -gF message-command-style "bg=#{@p_active},fg=#{@p_active_fg},bold"
set -gF mode-style "bg=#{@p_active},fg=#{@p_active_fg}"
set -gF clock-mode-colour "#{@p_active}"
set -g clock-mode-style 24
